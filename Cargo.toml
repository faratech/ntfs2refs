[package]
name = "ntfs2refs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Offline NTFS to ReFS conversion research and validation tools"
publish = false
default-run = "ntfs2refs"

[workspace]
members = ["crates/n2r-win32"]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ntfs = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
n2r-win32 = { path = "crates/n2r-win32" }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true

# Keep native-lab development builds from exhausting the image reserve.
[profile.dev]
debug = 1
incremental = false

[lints.rust]
unsafe_code = "forbid"
