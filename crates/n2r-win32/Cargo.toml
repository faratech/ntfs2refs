[package]
name = "n2r-win32"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Windows disk, volume and virtual-disk access for ntfs2refs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Vhd", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile = "3"
