name: Windows MSVC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Rust 1.98.1 / x64 MSVC
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    steps:
      # Official actions/checkout v5 tag verified through the GitHub API.
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install and verify the pinned toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $channels = @(Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"1\.98\.1"\s*$')
          if ($channels.Count -ne 1) { throw 'Update CI together with the pinned Rust toolchain.' }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = @(rustc -vV)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Windows MSVC host required.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Existing warnings remain visible; nonzero Clippy failures block CI.
      # This is not a zero-warning gate. See .github/CI.md.
      - name: Run Clippy
        run: |
          cargo clippy --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run workspace tests
        run: |
          cargo test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-release:
    name: Rust 1.98.1 / release executables
    runs-on: windows-2025
    # Cold compilation of all laboratory binaries needs its own budget; the
    # checks job previously left it only 29 minutes before the job deadline.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install and verify the pinned toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $channels = @(Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"1\.98\.1"\s*$')
          if ($channels.Count -ne 1) { throw 'Update CI together with the pinned Rust toolchain.' }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = @(rustc -vV)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Windows MSVC host required.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release executables
        run: |
          cargo build --locked --workspace --bins --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
