[package]
name = "n2r-win32"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Bounded Windows disk access for ntfs2refs laboratory qualification"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile = "3"
