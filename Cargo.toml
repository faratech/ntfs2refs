[package]
name = "ntfs2refs"
version = "0.0.3"
edition = "2024"
rust-version = "1.100"
description = "Converts an NTFS volume to ReFS in place"
publish = false
default-run = "ntfs2refs"

[workspace]
members = ["crates/n2r-win32"]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ntfs = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
n2r-win32 = { path = "crates/n2r-win32" }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
# Function names and line numbers in the separate .pdb, for --sample-stacks.
# The executable itself is unchanged.
debug = "line-tables-only"
# Optimise across the crates: the converter calls into n2r-win32 and the
# hashing crates from its inner loops. Thin, with the default number of code
# generation units, so that a build still uses every core.
lto = "thin"

# Keep native-lab development builds from exhausting the image reserve.
[profile.dev]
debug = 1
incremental = false

# The tests hash megabytes with these crates, and unoptimised they are tens of
# times slower than they need be: one test took 28 of the 29 seconds the
# library's tests ran. They are small, build once, and are not what a test
# is stepping through. The release profile is not affected.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.xxhash-rust]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.hex]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
